{% extends 'base.html' %}
{% block title %}Add Restaurant{% endblock %}
{% block content %}
<div class="form-card" style="max-width:600px;">
  <h2 class="form-title">🏪 Add New Restaurant</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
      <label>Restaurant Name *</label>
      <input type="text" name="name" class="form-control" placeholder="e.g. Burger Palace" required/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" class="form-control" rows="3" placeholder="Describe your restaurant..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone *</label>
        <input type="text" name="phone" class="form-control" placeholder="+92-xxx-xxxxxxx" required/>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select name="category" class="form-control">
          <option value="">— Select Category —</option>
          {% for cat in categories %}
            <option value="{{ cat.pk }}">{{ cat.icon }} {{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Address *</label>
      <input type="text" name="address" class="form-control" placeholder="Full street address" required/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Delivery Time (mins)</label>
        <input type="number" name="delivery_time" class="form-control" value="30" min="10"/>
      </div>
      <div class="form-group">
        <label>Minimum Order (PKR)</label>
        <input type="number" name="min_order" class="form-control" value="200" min="0"/>
      </div>
    </div>
    <div class="form-group">
      <label>Restaurant Image</label>
      <input type="file" name="image" class="form-control" accept="image/*"/>
    </div>
    <button type="submit" class="btn-primary" style="width:100%; padding:0.8rem;">
      <i class="fas fa-plus"></i> Add Restaurant
    </button>
  </form>
</div>
{% endblock %}
