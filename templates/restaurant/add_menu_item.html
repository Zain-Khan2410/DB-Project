{% extends 'base.html' %}
{% block title %}Add Menu Item{% endblock %}
{% block content %}
<div class="form-card" style="max-width:560px;">
  <h2 class="form-title">🍴 Add Menu Item</h2>
  <p style="text-align:center; color:var(--text-light); margin-bottom:1.5rem;">For: <strong>{{ restaurant.name }}</strong></p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
      <label>Item Name *</label>
      <input type="text" name="name" class="form-control" placeholder="e.g. Chicken Burger" required/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" class="form-control" rows="2" placeholder="Brief description of the item"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price (PKR) *</label>
        <input type="number" name="price" class="form-control" placeholder="e.g. 450" step="0.01" min="0" required/>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" class="form-control" placeholder="e.g. Burgers, Drinks"/>
      </div>
    </div>
    <div class="form-group">
      <label>Item Image</label>
      <input type="file" name="image" class="form-control" accept="image/*"/>
    </div>
    <div class="form-group" style="display:flex; align-items:center; gap:0.75rem;">
      <input type="checkbox" name="is_veg" id="is_veg" style="width:18px; height:18px;"/>
      <label for="is_veg" style="margin:0;">🌿 This is a vegetarian item</label>
    </div>
    <button type="submit" class="btn-primary" style="width:100%; padding:0.8rem;">
      <i class="fas fa-plus"></i> Add to Menu
    </button>
  </form>
  <div style="margin-top:1rem; text-align:center;">
    <a href="{% url 'restaurant:owner_dashboard' %}" class="btn-outline btn-sm">← Back to Dashboard</a>
  </div>
</div>
{% endblock %}
