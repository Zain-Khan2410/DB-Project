{% extends 'base.html' %}
{% block title %}My Profile — FoodRush{% endblock %}
{% block content %}
<div class="form-card" style="max-width:520px;">
  <h2 class="form-title">👤 My Profile</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% if user.profile_pic %}
      <div style="text-align:center; margin-bottom:1rem;">
        <img src="{{ user.profile_pic.url }}" alt="Profile" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid var(--primary);"/>
      </div>
    {% endif %}
    <div class="form-group">
      <label>Profile Picture</label>
      <input type="file" name="profile_pic" class="form-control" accept="image/*"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Username</label>
        <input type="text" class="form-control" value="{{ user.username }}" disabled style="background:#f5f5f5;"/>
      </div>
      <div class="form-group">
        <label>Role</label>
        <input type="text" class="form-control" value="{{ user.get_role_display }}" disabled style="background:#f5f5f5;"/>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" class="form-control" value="{{ user.email }}"/>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" class="form-control" value="{{ user.phone }}" placeholder="+92-xxx-xxxxxxx"/>
    </div>
    <div class="form-group">
      <label>Delivery Address</label>
      <textarea name="address" class="form-control" rows="2" placeholder="Your address">{{ user.address }}</textarea>
    </div>
    <button type="submit" class="btn-primary" style="width:100%; padding:0.8rem;">
      <i class="fas fa-save"></i> Save Changes
    </button>
  </form>
  <div style="margin-top:1.5rem; text-align:center;">
    <a href="{% url 'orders:my_orders' %}" class="btn-outline btn-sm"><i class="fas fa-list"></i> View My Orders</a>
  </div>
</div>
{% endblock %}
