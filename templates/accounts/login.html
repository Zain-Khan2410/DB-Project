{% extends 'base.html' %}
{% block title %}Login — FoodRush{% endblock %}
{% block content %}
<div class="form-card">
  <div style="text-align:center; margin-bottom:1.5rem;">
    <div style="font-size:3rem;">🍔</div>
    <h2 class="form-title" style="margin-bottom:0;">Welcome Back!</h2>
    <p style="color:var(--text-light); font-size:0.9rem;">Sign in to your FoodRush account</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required autofocus/>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required/>
    </div>
    <button type="submit" class="btn-primary" style="width:100%; padding:0.8rem; font-size:1rem; margin-top:0.5rem;">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </form>

  <p style="text-align:center; margin-top:1.5rem; color:var(--text-light); font-size:0.9rem;">
    Don't have an account? <a href="{% url 'accounts:register' %}" style="color:var(--primary); font-weight:600;">Register here</a>
  </p>
</div>
{% endblock %}
