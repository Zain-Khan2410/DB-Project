{% extends 'base.html' %}
{% block title %}Register — FoodRush{% endblock %}
{% block content %}
<div class="form-card" style="max-width:550px;">
  <div style="text-align:center; margin-bottom:1.5rem;">
    <div style="font-size:3rem;">🎉</div>
    <h2 class="form-title" style="margin-bottom:0;">Create Account</h2>
    <p style="color:var(--text-light); font-size:0.9rem;">Join FoodRush today!</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label>Username *</label>
        <input type="text" name="username" class="form-control" placeholder="Choose username" required/>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" class="form-control" placeholder="+92-xxx-xxxxxxx"/>
      </div>
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password1" class="form-control" placeholder="Min 8 chars" required/>
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <input type="password" name="password2" class="form-control" placeholder="Repeat password" required/>
      </div>
    </div>
    <div class="form-group">
      <label>Delivery Address</label>
      <input type="text" name="address" class="form-control" placeholder="Your street address"/>
    </div>
    <div class="form-group">
      <label>Role *</label>
      <select name="role" class="form-control">
        <option value="customer">🛍️ Customer — I want to order food</option>
        <option value="restaurant_owner">🏪 Restaurant Owner — I want to list my restaurant</option>
      </select>
    </div>
    <button type="submit" class="btn-primary" style="width:100%; padding:0.8rem; font-size:1rem; margin-top:0.5rem;">
      <i class="fas fa-user-plus"></i> Create Account
    </button>
  </form>

  <p style="text-align:center; margin-top:1.5rem; color:var(--text-light); font-size:0.9rem;">
    Already have an account? <a href="{% url 'accounts:login' %}" style="color:var(--primary); font-weight:600;">Login</a>
  </p>
</div>
{% endblock %}
